<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperOdds — Resumo do Dia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #080a0d;
    --s1:      #0e1116;
    --s2:      #141820;
    --s3:      #1a1f29;
    --b0:      #232a38;
    --b1:      #2d3548;
    --green:   #00f590;
    --green2:  #00c46f;
    --gbg:     #011a0a;
    --gbr:     #0a4a20;
    --red:     #ff4d6a;
    --rbg:     #1a0508;
    --rbr:     #5c1020;
    --amber:   #ffc94d;
    --abg:     #1a1005;
    --abr:     #5c3d08;
    --blue:    #38c9ff;
    --bbg:     #030f1a;
    --bbr:     #0a3050;
    --text:    #eaf0ff;
    --t2:      #8892a8;
    --t3:      #4a5068;
    --mono:    'JetBrains Mono', monospace;
    --sans:    'Outfit', sans-serif;
  }

  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── HEADER ── */
  .site-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px;
    border-bottom: 1px solid var(--b0);
    background: var(--s1);
    position: sticky; top: 0; z-index: 10;
  }
  .logo {
    font-size: 17px; font-weight: 800; letter-spacing: -.5px;
    color: var(--text);
    display: flex; align-items: center; gap: 8px;
  }
  .logo span { color: var(--green); }

  /* ── DATE PICKER ── */
  .date-bar {
    display: flex; align-items: center; gap: 10px;
  }
  .date-btn {
    background: var(--s2); border: 1px solid var(--b0);
    color: var(--t2); border-radius: 8px; padding: 7px 10px;
    font-size: 18px; cursor: pointer; line-height: 1;
    transition: border-color .15s, color .15s;
  }
  .date-btn:hover { border-color: var(--b1); color: var(--text); }
  .date-input {
    background: var(--s2); border: 1px solid var(--b0);
    color: var(--text); border-radius: 8px;
    padding: 7px 12px; font-family: var(--mono);
    font-size: 13px; outline: none; cursor: pointer;
    transition: border-color .15s;
  }
  .date-input:focus { border-color: var(--green); }
  .date-input::-webkit-calendar-picker-indicator { filter: invert(.5); cursor: pointer; }

  /* ── MAIN ── */
  .main { max-width: 820px; margin: 0 auto; padding: 32px 20px 60px; }

  /* ── BANNER ── */
  .banner {
    border-radius: 16px; padding: 24px 28px;
    margin-bottom: 24px;
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    border: 1px solid var(--b0);
    background: var(--s1);
    position: relative; overflow: hidden;
  }
  .banner::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 0% 50%, rgba(0,245,144,.08) 0%, transparent 60%);
    pointer-events: none;
  }
  .banner.neg::before {
    background: radial-gradient(ellipse at 0% 50%, rgba(255,77,106,.08) 0%, transparent 60%);
  }
  .banner-label { font-size: 11px; font-family: var(--mono); color: var(--t3); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
  .banner-val { font-size: 36px; font-weight: 800; letter-spacing: -1.5px; }
  .banner-val.pos { color: var(--green); }
  .banner-val.neg { color: var(--red); }
  .banner-sub { font-size: 13px; color: var(--t2); margin-top: 2px; }
  .banner-date { margin-left: auto; font-family: var(--mono); font-size: 13px; color: var(--t3); text-align: right; }

  /* ── KPI GRID ── */
  .kgrid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 24px;
  }
  @media (max-width: 600px) { .kgrid { grid-template-columns: repeat(2, 1fr); } }

  .kcard {
    background: var(--s1); border: 1px solid var(--b0);
    border-radius: 12px; padding: 14px 16px;
  }
  .kcard-label { font-size: 10px; font-family: var(--mono); color: var(--t3); letter-spacing: .8px; text-transform: uppercase; margin-bottom: 6px; }
  .kcard-val { font-size: 22px; font-weight: 700; }
  .kcard-val.g { color: var(--green); }
  .kcard-val.r { color: var(--red); }
  .kcard-val.a { color: var(--amber); }
  .kcard-val.b { color: var(--blue); }

  /* ── SECTION ── */
  .section { margin-bottom: 20px; }
  .section-title {
    font-size: 11px; font-family: var(--mono); color: var(--t3);
    letter-spacing: 1px; text-transform: uppercase;
    margin-bottom: 10px; padding-left: 2px;
  }

  /* ── BET CARDS ── */
  .bet-card {
    background: var(--s1); border: 1px solid var(--b0);
    border-radius: 12px; padding: 14px 16px;
    margin-bottom: 8px;
    display: flex; align-items: flex-start; gap: 12px;
  }
  .bet-card.green { border-color: var(--gbr); background: var(--gbg); }
  .bet-card.red   { border-color: var(--rbr); background: var(--rbg); }
  .bet-card.void  { border-color: var(--bbr); background: var(--bbg); }
  .bet-card.pend  { border-color: var(--abr); background: var(--abg); }

  .bet-emoji { font-size: 22px; flex-shrink: 0; margin-top: 1px; }
  .bet-body { flex: 1; min-width: 0; }
  .bet-ap { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 6px; line-height: 1.4; }
  .bet-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .meta-pill {
    font-size: 11px; font-family: var(--mono); color: var(--t2);
    background: rgba(255,255,255,.04); border: 1px solid var(--b0);
    border-radius: 6px; padding: 2px 8px;
  }
  .meta-odd { font-size: 12px; font-family: var(--mono); font-weight: 700; color: var(--amber); }

  .bet-right { text-align: right; flex-shrink: 0; }
  .bet-badge {
    font-size: 10px; font-family: var(--mono); font-weight: 700;
    padding: 3px 8px; border-radius: 20px; letter-spacing: .5px;
    margin-bottom: 6px; display: inline-block;
  }
  .bg { background: var(--gbg); border: 1px solid var(--gbr); color: var(--green); }
  .br { background: var(--rbg); border: 1px solid var(--rbr); color: var(--red); }
  .bv { background: var(--bbg); border: 1px solid var(--bbr); color: var(--blue); }
  .bp { background: var(--abg); border: 1px solid var(--abr); color: var(--amber); }
  .bet-lucro { font-size: 14px; font-family: var(--mono); font-weight: 700; }
  .bet-lucro.pos { color: var(--green); }
  .bet-lucro.neg { color: var(--red); }

  /* ── EMPTY / LOADING ── */
  .empty { text-align: center; padding: 60px 20px; color: var(--t3); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .loading { text-align: center; padding: 60px 20px; color: var(--t3); display: flex; align-items: center; justify-content: center; gap: 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { width: 20px; height: 20px; border: 2px solid var(--b0); border-top-color: var(--green); border-radius: 50%; animation: spin .7s linear infinite; }

  /* ── FOOTER ── */
  .site-footer { text-align: center; padding: 24px; font-size: 12px; color: var(--t3); border-top: 1px solid var(--b0); }
</style>
</head>
<body>

<header class="site-header">
  <div class="logo">Super<span>Odds</span></div>
  <div class="date-bar">
    <button class="date-btn" id="prev-btn" title="Dia anterior">‹</button>
    <input type="date" class="date-input" id="date-input">
    <button class="date-btn" id="next-btn" title="Próximo dia">›</button>
  </div>
</header>

<main class="main" id="main">
  <div class="loading"><div class="spinner"></div> Carregando...</div>
</main>

<footer class="site-footer">SuperOdds · Resumo do Dia</footer>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
// ── CONFIG ────────────────────────────────────────────────────────
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyC3G9SfJ1BJSyakIttfR4N2lTm9c-IlfPk",
  authDomain:        "dashboardapostas.firebaseapp.com",
  projectId:         "dashboardapostas",
  storageBucket:     "dashboardapostas.firebasestorage.app",
  messagingSenderId: "711928525206",
  appId:             "1:711928525206:web:bb8d4d5ae23668b18e6db7"
};
const FIREBASE_UID = "9qxL2o87OKbNBPQytm4al49elf32";

firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();

// ── HELPERS ───────────────────────────────────────────────────────
const EMOJI = { 'Futebol':'⚽','Basquete':'🏀','Tênis':'🎾','MMA':'🥊','Vôlei':'🏐','E-sports':'🎮','Outros':'🎲' };

function fmtR(v) {
  if (v === null || v === undefined) return '—';
  const n = parseFloat(v);
  const s = Math.abs(n).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (n < 0 ? '-' : '') + 'R$ ' + s;
}

function luc(b) {
  const s = parseFloat(b.stake || 0);
  const o = parseFloat(b.odd || 0);
  if (b.res === 'GREEN') return s * (o - 1);
  if (b.res === 'RED')   return -s;
  return 0;
}

function hojeStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function datePretty(str) {
  if (!str) return '';
  const [y,m,d] = str.split('-');
  const nomes = ['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const dias  = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const dt = new Date(`${str}T12:00:00`);
  return `${dias[dt.getDay()]}, ${d} ${nomes[+m]} ${y}`;
}

// ── RENDER ────────────────────────────────────────────────────────
function render(bets, date) {
  const main = document.getElementById('main');

  if (!bets.length) {
    main.innerHTML = `<div class="empty"><div class="empty-icon">📅</div>Nenhuma aposta registrada em ${datePretty(date)}.</div>`;
    return;
  }

  const green = bets.filter(b => b.res === 'GREEN');
  const red   = bets.filter(b => b.res === 'RED');
  const void_ = bets.filter(b => b.res === 'VOID');
  const pend  = bets.filter(b => !b.res || b.res === 'PENDENTE');
  const res   = bets.filter(b => b.res && b.res !== 'PENDENTE');

  const lucroTotal = res.reduce((s,b) => s + luc(b), 0);
  const stakeTotal = bets.reduce((s,b) => s + parseFloat(b.stake||0), 0);
  const roi = stakeTotal > 0 ? (lucroTotal/stakeTotal*100) : 0;
  const acerto = (green.length+red.length) > 0 ? green.length/(green.length+red.length)*100 : null;
  const pos = lucroTotal >= 0;

  // banner
  const bannerHTML = `
    <div class="banner${pos?'':' neg'}">
      <div>
        <div class="banner-label">Resultado do dia</div>
        <div class="banner-val ${pos?'pos':'neg'}">${pos?'+':''}${fmtR(lucroTotal)}</div>
        <div class="banner-sub">${bets.length} apostas · stake ${fmtR(stakeTotal)}</div>
      </div>
      <div class="banner-date">${datePretty(date)}</div>
    </div>`;

  // kpis
  const kpiHTML = `
    <div class="kgrid">
      <div class="kcard"><div class="kcard-label">GREEN</div><div class="kcard-val g">${green.length}</div></div>
      <div class="kcard"><div class="kcard-label">RED</div><div class="kcard-val r">${red.length}</div></div>
      <div class="kcard"><div class="kcard-label">ROI</div><div class="kcard-val ${pos?'g':'r'}">${roi.toFixed(1)}%</div></div>
      <div class="kcard"><div class="kcard-label">ACERTO</div><div class="kcard-val ${acerto===null?'':'acerto>=50?g:r'}">${acerto!==null?acerto.toFixed(0)+'%':'—'}</div></div>
    </div>`;

  function betCard(b) {
    const cls = b.res==='GREEN'?'green':b.res==='RED'?'red':b.res==='VOID'?'void':'pend';
    const badge = b.res==='GREEN'?'bg':b.res==='RED'?'br':b.res==='VOID'?'bv':'bp';
    const badgeTxt = b.res || 'PEND';
    const emoji = EMOJI[b.esp] || '🎲';
    const l = luc(b);
    const lucroHTML = b.res && b.res !== 'PENDENTE'
      ? `<div class="bet-lucro ${l>=0?'pos':'neg'}">${l>0?'+':''}${fmtR(l)}</div>`
      : `<div class="bet-lucro" style="color:var(--t3)">${fmtR(b.stake)}</div>`;
    return `
      <div class="bet-card ${cls}">
        <div class="bet-emoji">${emoji}</div>
        <div class="bet-body">
          <div class="bet-ap">${b.ap||'—'}</div>
          <div class="bet-meta">
            ${b.casa?`<span class="meta-pill">${b.casa}</span>`:''}
            <span class="meta-odd">@${b.odd??'—'}</span>
          </div>
        </div>
        <div class="bet-right">
          <div class="bet-badge ${badge}">${badgeTxt}</div>
          ${lucroHTML}
        </div>
      </div>`;
  }

  const secoes = [
    { label: '🟢 Green', list: green },
    { label: '🔴 Red', list: red },
    { label: '⚪ Void', list: void_ },
    { label: '⏳ Pendentes', list: pend },
  ].filter(s => s.list.length > 0);

  const secoesHTML = secoes.map(s => `
    <div class="section">
      <div class="section-title">${s.label}</div>
      ${s.list.map(betCard).join('')}
    </div>`).join('');

  main.innerHTML = bannerHTML + kpiHTML + secoesHTML;
}

// ── DATA FETCH ────────────────────────────────────────────────────
async function load(date) {
  document.getElementById('main').innerHTML = `<div class="loading"><div class="spinner"></div> Carregando...</div>`;
  try {
    const snap = await db.collection('users').doc(FIREBASE_UID).collection('bets')
      .where('dat', '==', date).get();
    const bets = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    // ordena: resolvidas primeiro, depois por horário de criação
    bets.sort((a,b) => {
      const order = {GREEN:0,RED:1,VOID:2,PENDENTE:3};
      const oa = order[a.res]??3, ob = order[b.res]??3;
      return oa - ob;
    });
    render(bets, date);
  } catch(e) {
    document.getElementById('main').innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div>Erro ao carregar. Tente novamente.</div>`;
    console.error(e);
  }
}

// ── DATE NAV ──────────────────────────────────────────────────────
const input = document.getElementById('date-input');
input.value = hojeStr();
load(input.value);

input.addEventListener('change', () => load(input.value));

document.getElementById('prev-btn').addEventListener('click', () => {
  const d = new Date(input.value + 'T12:00:00');
  d.setDate(d.getDate() - 1);
  input.value = d.toISOString().split('T')[0];
  load(input.value);
});

document.getElementById('next-btn').addEventListener('click', () => {
  const d = new Date(input.value + 'T12:00:00');
  d.setDate(d.getDate() + 1);
  input.value = d.toISOString().split('T')[0];
  load(input.value);
});
</script>
</body>
</html>
