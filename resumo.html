<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperOdds — Resumo do Dia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#080a0d; --s1:#0e1116; --s2:#141820; --s3:#1a1f29; --b0:#232a38; --b1:#2d3548;
    --green:#00f590; --green2:#00c46f; --gbg:#011a0a; --gbr:#0a4a20;
    --red:#ff4d6a; --rbg:#1a0508; --rbr:#5c1020;
    --amber:#ffc94d; --abg:#1a1005; --abr:#5c3d08;
    --blue:#38c9ff; --bbg:#030f1a; --bbr:#0a3050;
    --text:#eaf0ff; --t2:#8892a8; --t3:#4a5068;
    --mono:'JetBrains Mono',monospace; --sans:'Outfit',sans-serif;
  }
  html { scroll-behavior: smooth; }
  body { background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; -webkit-font-smoothing:antialiased; }

  .site-header {
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px; border-bottom:1px solid var(--b0); background:var(--s1);
    position:sticky; top:0; z-index:10;
  }
  .logo { font-size:17px; font-weight:800; letter-spacing:-.5px; display:flex; align-items:center; gap:6px; }
  .logo span { color:var(--green); }
  .user-badge { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--t2); font-family:var(--mono); }
  .user-badge img { width:24px; height:24px; border-radius:50%; }
  .btn-sair { background:var(--rbg); border:1px solid var(--rbr); color:var(--red); border-radius:6px; padding:3px 10px; font-size:11px; cursor:pointer; font-family:var(--mono); }

  .date-bar { display:flex; align-items:center; gap:8px; padding:16px 24px; border-bottom:1px solid var(--b0); background:var(--s1); }
  .date-btn { background:var(--s2); border:1px solid var(--b0); color:var(--t2); border-radius:8px; padding:6px 10px; font-size:16px; cursor:pointer; transition:.15s; }
  .date-btn:hover { border-color:var(--b1); color:var(--text); }
  .date-input { background:var(--s2); border:1px solid var(--b0); color:var(--text); border-radius:8px; padding:6px 12px; font-family:var(--mono); font-size:13px; outline:none; }
  .date-input:focus { border-color:var(--green); }
  .date-input::-webkit-calendar-picker-indicator { filter:invert(.5); cursor:pointer; }

  .main { max-width:820px; margin:0 auto; padding:24px 16px 60px; }

  .banner { border-radius:14px; padding:20px 24px; margin-bottom:20px; border:1px solid var(--b0); background:var(--s1); position:relative; overflow:hidden; }
  .banner::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 0% 50%,rgba(0,245,144,.08) 0%,transparent 60%); pointer-events:none; }
  .banner.neg::before { background:radial-gradient(ellipse at 0% 50%,rgba(255,77,106,.08) 0%,transparent 60%); }
  .banner-label { font-size:10px; font-family:var(--mono); color:var(--t3); letter-spacing:1px; text-transform:uppercase; margin-bottom:4px; }
  .banner-val { font-size:32px; font-weight:800; letter-spacing:-1.5px; }
  .banner-val.pos { color:var(--green); }
  .banner-val.neg { color:var(--red); }
  .banner-sub { font-size:12px; color:var(--t2); margin-top:2px; }
  .banner-right { position:absolute; right:24px; top:50%; transform:translateY(-50%); font-family:var(--mono); font-size:12px; color:var(--t3); text-align:right; }

  .kgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:20px; }
  @media(max-width:600px){ .kgrid{ grid-template-columns:repeat(2,1fr); } }
  .kcard { background:var(--s1); border:1px solid var(--b0); border-radius:10px; padding:12px 14px; }
  .kcard-label { font-size:10px; font-family:var(--mono); color:var(--t3); letter-spacing:.8px; text-transform:uppercase; margin-bottom:4px; }
  .kcard-val { font-size:20px; font-weight:700; }
  .g { color:var(--green); } .r { color:var(--red); } .a { color:var(--amber); } .b { color:var(--blue); }

  .section { margin-bottom:16px; }
  .section-title { font-size:10px; font-family:var(--mono); color:var(--t3); letter-spacing:1px; text-transform:uppercase; margin-bottom:8px; padding-left:2px; }

  .bet-card { background:var(--s1); border:1px solid var(--b0); border-radius:12px; padding:12px 14px; margin-bottom:6px; display:flex; align-items:flex-start; gap:10px; }
  .bet-card.green { border-color:var(--gbr); background:var(--gbg); }
  .bet-card.red   { border-color:var(--rbr); background:var(--rbg); }
  .bet-card.void  { border-color:var(--bbr); background:var(--bbg); }
  .bet-card.pend  { border-color:var(--abr); background:var(--abg); }
  .bet-emoji { font-size:20px; flex-shrink:0; margin-top:1px; }
  .bet-body { flex:1; min-width:0; }
  .bet-ap { font-size:13px; font-weight:600; color:var(--text); margin-bottom:5px; line-height:1.4; }
  .bet-meta { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .meta-pill { font-size:11px; font-family:var(--mono); color:var(--t2); background:rgba(255,255,255,.04); border:1px solid var(--b0); border-radius:5px; padding:2px 7px; }
  .meta-odd { font-size:12px; font-family:var(--mono); font-weight:700; color:var(--amber); }
  .bet-right { text-align:right; flex-shrink:0; }
  .bet-badge { font-size:10px; font-family:var(--mono); font-weight:700; padding:2px 8px; border-radius:20px; display:inline-block; margin-bottom:4px; }
  .bg { background:var(--gbg); border:1px solid var(--gbr); color:var(--green); }
  .br { background:var(--rbg); border:1px solid var(--rbr); color:var(--red); }
  .bv { background:var(--bbg); border:1px solid var(--bbr); color:var(--blue); }
  .bp { background:var(--abg); border:1px solid var(--abr); color:var(--amber); }
  .bet-lucro { font-size:13px; font-family:var(--mono); font-weight:700; }
  .bet-lucro.pos { color:var(--green); } .bet-lucro.neg { color:var(--red); }

  .empty { text-align:center; padding:60px 20px; color:var(--t3); }
  .empty-icon { font-size:40px; margin-bottom:12px; }
  .loading { text-align:center; padding:60px 20px; color:var(--t3); display:flex; align-items:center; justify-content:center; gap:10px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .spinner { width:20px; height:20px; border:2px solid var(--b0); border-top-color:var(--green); border-radius:50%; animation:spin .7s linear infinite; }
  .site-footer { text-align:center; padding:20px; font-size:12px; color:var(--t3); border-top:1px solid var(--b0); }
</style>
</head>
<body>

<header class="site-header">
  <div class="logo">Super<span>Odds</span></div>
  <div class="user-badge" id="user-badge" style="display:none">
    <img id="user-photo" src="" alt="">
    <span id="user-name"></span>
    <button class="btn-sair" onclick="logout()">sair</button>
  </div>
</header>

<div class="date-bar" id="date-bar" style="display:none">
  <button class="date-btn" id="prev-btn">‹</button>
  <input type="date" class="date-input" id="date-input">
  <button class="date-btn" id="next-btn">›</button>
</div>

<main class="main" id="main">
  <div class="loading"><div class="spinner"></div> Verificando sessão...</div>
</main>

<footer class="site-footer">SuperOdds · Resumo do Dia</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyC3G9SfJ1BJSyakIttfR4N2lTm9c-IlfPk",
  authDomain:        "dashboardapostas.firebaseapp.com",
  projectId:         "dashboardapostas",
  storageBucket:     "dashboardapostas.firebasestorage.app",
  messagingSenderId: "711928525206",
  appId:             "1:711928525206:web:bb8d4d5ae23668b18e6db7"
};
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db   = firebase.firestore();
let uid = null;

const EMOJI = {'Futebol':'⚽','Basquete':'🏀','Tênis':'🎾','MMA':'🥊','Vôlei':'🏐','E-sports':'🎮','Outros':'🎲'};

function fmtR(v) {
  const n = parseFloat(v||0);
  const s = Math.abs(n).toFixed(2).replace('.',',');
  return (n<0?'-':'')+'R$ '+s;
}
function luc(b) {
  const s=parseFloat(b.stake||0), o=parseFloat(b.odd||0);
  if(b.res==='GREEN') return s*(o-1);
  if(b.res==='RED')   return -s;
  return 0;
}
function hojeStr() {
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function datePretty(str) {
  if(!str) return '';
  const [y,m,d]=str.split('-');
  const nomes=['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const dias=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const dt=new Date(`${str}T12:00:00`);
  return `${dias[dt.getDay()]}, ${d} ${nomes[+m]} ${y}`;
}

function render(bets, date) {
  const main=document.getElementById('main');
  if(!bets.length) {
    main.innerHTML=`<div class="empty"><div class="empty-icon">📅</div>Nenhuma aposta em ${datePretty(date)}.</div>`;
    return;
  }
  const green=bets.filter(b=>b.res==='GREEN');
  const red=bets.filter(b=>b.res==='RED');
  const void_=bets.filter(b=>b.res==='VOID');
  const pend=bets.filter(b=>!b.res||b.res==='PENDENTE');
  const res=bets.filter(b=>b.res&&b.res!=='PENDENTE');
  const lucroTotal=res.reduce((s,b)=>s+luc(b),0);
  const stakeTotal=bets.reduce((s,b)=>s+parseFloat(b.stake||0),0);
  const roi=stakeTotal>0?(lucroTotal/stakeTotal*100):0;
  const acerto=(green.length+red.length)>0?green.length/(green.length+red.length)*100:null;
  const pos=lucroTotal>=0;

  function betCard(b) {
    const cls=b.res==='GREEN'?'green':b.res==='RED'?'red':b.res==='VOID'?'void':'pend';
    const badge=b.res==='GREEN'?'bg':b.res==='RED'?'br':b.res==='VOID'?'bv':'bp';
    const l=luc(b);
    const lucroHTML=b.res&&b.res!=='PENDENTE'
      ?`<div class="bet-lucro ${l>=0?'pos':'neg'}">${l>0?'+':''}${fmtR(l)}</div>`
      :`<div class="bet-lucro" style="color:var(--t3)">${fmtR(b.stake)}</div>`;
    return `<div class="bet-card ${cls}">
      <div class="bet-emoji">${EMOJI[b.esp]||'🎲'}</div>
      <div class="bet-body">
        <div class="bet-ap">${b.ap||'—'}</div>
        <div class="bet-meta">
          ${b.casa?`<span class="meta-pill">${b.casa}</span>`:''}
          <span class="meta-odd">@${b.odd??'—'}</span>
        </div>
      </div>
      <div class="bet-right">
        <div class="bet-badge ${badge}">${b.res||'PEND'}</div>
        ${lucroHTML}
      </div>
    </div>`;
  }

  const secoes=[
    {label:'🟢 Green',list:green},
    {label:'🔴 Red',list:red},
    {label:'⚪ Void',list:void_},
    {label:'⏳ Pendentes',list:pend},
  ].filter(s=>s.list.length>0);

  main.innerHTML=`
    <div class="banner${pos?'':' neg'}">
      <div>
        <div class="banner-label">Resultado do dia</div>
        <div class="banner-val ${pos?'pos':'neg'}">${pos?'+':''}${fmtR(lucroTotal)}</div>
        <div class="banner-sub">${bets.length} apostas · stake ${fmtR(stakeTotal)}</div>
      </div>
      <div class="banner-right">${datePretty(date)}</div>
    </div>
    <div class="kgrid">
      <div class="kcard"><div class="kcard-label">GREEN</div><div class="kcard-val g">${green.length}</div></div>
      <div class="kcard"><div class="kcard-label">RED</div><div class="kcard-val r">${red.length}</div></div>
      <div class="kcard"><div class="kcard-label">ROI</div><div class="kcard-val ${pos?'g':'r'}">${roi.toFixed(1)}%</div></div>
      <div class="kcard"><div class="kcard-label">ACERTO</div><div class="kcard-val ${acerto!==null&&acerto>=50?'g':'r'}">${acerto!==null?acerto.toFixed(0)+'%':'—'}</div></div>
    </div>
    ${secoes.map(s=>`<div class="section"><div class="section-title">${s.label}</div>${s.list.map(betCard).join('')}</div>`).join('')}`;
}

async function load(date) {
  if(!uid) return;
  document.getElementById('main').innerHTML=`<div class="loading"><div class="spinner"></div> Carregando...</div>`;
  try {
    const snap=await db.collection('users').doc(uid).collection('bets').where('dat','==',date).get();
    const bets=snap.docs.map(d=>({id:d.id,...d.data()}));
    bets.sort((a,b)=>{const o={GREEN:0,RED:1,VOID:2,PENDENTE:3};return (o[a.res]??3)-(o[b.res]??3);});
    render(bets,date);
  } catch(e) {
    document.getElementById('main').innerHTML=`<div class="empty"><div class="empty-icon">⚠️</div>Erro ao carregar.</div>`;
  }
}

// ── AUTH ──────────────────────────────────────────────────────────
const provider=new firebase.auth.GoogleAuthProvider();
provider.setCustomParameters({prompt:'select_account'});

function showLogin() {
  document.getElementById('main').innerHTML=`
    <div style="display:flex;align-items:center;justify-content:center;min-height:60vh">
      <div style="background:var(--s1);border:1px solid var(--b0);border-radius:16px;padding:40px 36px;width:min(360px,90vw);text-align:center">
        <div style="font-size:28px;margin-bottom:8px">⚡</div>
        <div style="font-size:20px;font-weight:700;margin-bottom:6px">SuperOdds</div>
        <div style="font-size:11px;font-family:var(--mono);color:var(--t3);letter-spacing:1px;margin-bottom:28px">RESUMO DO DIA</div>
        <button onclick="loginGoogle()" style="width:100%;padding:12px 20px;border-radius:10px;border:1px solid var(--b0);background:var(--s2);color:var(--text);font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20H24v8h11.3C33.6 33.3 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 20-8 20-20 0-1.3-.1-2.7-.4-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.1 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5l-6.2-5.2C29.4 35.5 26.8 36 24 36c-5.2 0-9.7-2.7-11.3-6.7l-6.5 5C9.5 40.1 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20H24v8h11.3c-.9 2.5-2.6 4.6-4.8 6l6.2 5.2C40.7 35.5 44 30.1 44 24c0-1.3-.1-2.7-.4-4z"/></svg>
          Entrar com Google
        </button>
        <div id="login-err" style="margin-top:10px;font-size:11px;color:var(--red);font-family:var(--mono);min-height:14px"></div>
      </div>
    </div>`;
}

async function loginGoogle() {
  try { await auth.signInWithPopup(provider); }
  catch(e) { document.getElementById('login-err').textContent='Erro: '+e.message; }
}

async function logout() {
  uid=null;
  document.getElementById('user-badge').style.display='none';
  document.getElementById('date-bar').style.display='none';
  await auth.signOut();
  showLogin();
}

const input=document.getElementById('date-input');
input.value=hojeStr();
input.addEventListener('change',()=>load(input.value));
document.getElementById('prev-btn').addEventListener('click',()=>{
  const d=new Date(input.value+'T12:00:00'); d.setDate(d.getDate()-1);
  input.value=d.toISOString().split('T')[0]; load(input.value);
});
document.getElementById('next-btn').addEventListener('click',()=>{
  const d=new Date(input.value+'T12:00:00'); d.setDate(d.getDate()+1);
  input.value=d.toISOString().split('T')[0]; load(input.value);
});

auth.onAuthStateChanged(user=>{
  if(user){
    uid=user.uid;
    document.getElementById('user-badge').style.display='flex';
    document.getElementById('date-bar').style.display='flex';
    document.getElementById('user-name').textContent=user.displayName?.split(' ')[0]||'';
    if(user.photoURL) document.getElementById('user-photo').src=user.photoURL;
    load(input.value);
  } else {
    showLogin();
  }
});
</script>
</body>
</html>
